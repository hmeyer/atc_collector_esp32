# Sensirion SCD4x (SCD40/SCD41) CO2 sensor on its own I2C bus.
# Include with: co2: !include {file: co2.yaml, vars: {sda: GPIOx, scl: GPIOy}}
#
# CO2 only: next to the board the sensor's temperature and humidity read
# far too warm/dry (+13 C measured), so they aren't exposed. The SCD4x
# compensates CO2 for its own temperature internally.

i2c:
  - id: co2_i2c
    sda: ${sda}
    scl: ${scl}
    frequency: 100kHz

sensor:
  - platform: scd4x
    i2c_id: co2_i2c
    co2:
      id: co2
      name: CO2
    # Berlin; only used for pressure compensation, a few 10 m don't matter.
    altitude_compensation: 40m
    # Assumes the room gets fresh air (~400 ppm) at least once a week.
    automatic_self_calibration: true
    update_interval: 60s
