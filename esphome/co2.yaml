# Sensirion SCD4x (SCD40/SCD41) CO2 sensor on its own I2C bus.
# Include with: co2: !include {file: co2.yaml, vars: {sda: GPIOx, scl: GPIOy}}
#
# Mount the sensor 5-10 cm away from the board: the board's heat skews the
# sensor's temperature and humidity (and therefore temperature_offset).

i2c:
  - id: co2_i2c
    sda: ${sda}
    scl: ${scl}
    frequency: 100kHz

sensor:
  - platform: scd4x
    i2c_id: co2_i2c
    co2:
      id: co2
      name: CO2
    temperature:
      id: co2_temperature
      name: Temperature
    humidity:
      id: co2_humidity
      name: Humidity
    # Berlin; only used for pressure compensation, a few 10 m don't matter.
    altitude_compensation: 40m
    # Assumes the room gets fresh air (~400 ppm) at least once a week.
    automatic_self_calibration: true
    # Calibrate against a reference thermometer once the sensor is mounted.
    temperature_offset: 4°C
    update_interval: 60s
