# ESP32-S3 Super Mini (ESP32-S3FH4R2, no display): Bluetooth proxy + CO2.
#
# The SCD4x breakout's 4-pin header (GND VDD SCL SDA) plugs straight into
# the Super Mini's row GND 3V3 13 12 (next to 5V, at the USB end).

substitutions:
  name: atc-s3mini
  friendly_name: ATC S3 Mini

packages:
  common: !include common.yaml
  co2: !include {file: co2.yaml, vars: {sda: GPIO12, scl: GPIO13}}

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf
