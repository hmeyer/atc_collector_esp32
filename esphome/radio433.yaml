# CC1101 433 MHz transceiver on its own SPI bus, tuned to Somfy RTS
# (433.42 MHz) for the window blinds.
# Include with: radio433: !include {file: radio433.yaml, vars: {...pins...}}
#
# Single GDO line: an edge-count diagnostic showed GDO0 carrying the
# demodulated signal while the GDO2 line to the board stayed silent. So GDO0
# is shared: in RX the CC1101 outputs the received data on it (IOCFG0 =
# 0x0D), in TX it reads the data to send from it. The pin is open-drain with
# a pull-up, so the ESP never drives against the CC1101's output, and the
# transmitter hands the line over around each transmission.

spi:
  - id: radio_spi
    clk_pin: ${sck}
    mosi_pin: ${mosi}
    miso_pin: ${miso}

cc1101:
  id: radio
  spi_id: radio_spi
  cs_pin: ${cs}
  # Somfy RTS. The default 433.92 MHz is 500 kHz off, outside the receive
  # filter (~203 kHz wide).
  frequency: 433.42MHz
  modulation_type: ASK/OOK

remote_receiver:
  pin:
    number: ${gdo0}
    allow_other_uses: true
    mode:
      input: true
      output: true
      open_drain: true
      pullup: true
  # Logs RTS frames from the remotes (and our own transmissions).
  dump: all

remote_transmitter:
  id: rts_tx
  pin:
    number: ${gdo0}
    allow_other_uses: true
    mode:
      input: true
      output: true
      open_drain: true
      pullup: true
  carrier_duty_percent: 100%
  non_blocking: true
  # Keep the line low (no carrier) until the CC1101 has left TX.
  eot_level: false
  on_transmit:
    then:
      - cc1101.set_idle: radio
      - remote_transmitter.digital_write:
          transmitter_id: rts_tx
          value: false
      - cc1101.begin_tx: radio
  on_complete:
    then:
      - cc1101.set_idle: radio
      - remote_transmitter.digital_write:
          transmitter_id: rts_tx
          value: true
      - cc1101.begin_rx: radio
