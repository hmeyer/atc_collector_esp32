# CC1101 433 MHz transceiver on its own SPI bus.
# Include with: radio433: !include {file: radio433.yaml, vars: {...pins...}}
#
# Tuned to Somfy RTS (433.42 MHz) for the window blinds. For now the
# receiver only logs what it hears ("dump: all"), to capture the remotes'
# RTS frames before adding entities.
#
# Single GDO line: an edge-count diagnostic showed GDO0 carrying the
# demodulated signal while the GDO2 line to the board stayed silent, so the
# receiver reads GDO0 (in RX the CC1101 outputs the data on GDO0, IOCFG0 =
# 0x0D). The transmitter will share this pin once RTS sending is added.

spi:
  - id: radio_spi
    clk_pin: ${sck}
    mosi_pin: ${mosi}
    miso_pin: ${miso}

cc1101:
  id: radio
  spi_id: radio_spi
  cs_pin: ${cs}
  # Somfy RTS. The default 433.92 MHz is 500 kHz off, outside the receive
  # filter (~203 kHz wide).
  frequency: 433.42MHz
  modulation_type: ASK/OOK

remote_receiver:
  pin: ${gdo0}
  dump: all
