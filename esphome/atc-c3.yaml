# ESP32-C3 board with a 0.42" 72x40 OLED.

substitutions:
  name: atc-c3
  friendly_name: ATC C3
  button_pin: GPIO9
  # Visible 72x40 window in the 128x64 frame buffer. It's centred in the
  # controller's 132x64 RAM at (30, 12); the SH1106 driver starts the
  # buffer at column 2, giving (28, 12). Centred, so 180 degree rotation
  # doesn't move it.
  oled_x: "28"
  oled_y: "12"

packages:
  common: !include common.yaml

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  # The on-board antenna of these mini boards is poorly matched; full power
  # causes dropouts.
  output_power: 8.5dB

i2c:
  sda: GPIO5
  scl: GPIO6
  # The default 50 kHz makes a full redraw take ~300 ms.
  frequency: 400kHz

font:
  - file: "gfonts://Silkscreen"
    id: small
    size: 8

display:
  # The controller has 132 columns (SH1106-like) and no horizontal
  # addressing mode, which the SSD1306 models rely on (the screen then
  # shows uninitialised RAM). The SH1106 model writes page by page.
  - platform: ssd1306_i2c
    id: oled
    model: "SH1106 128x64"
    address: 0x3C
    rotation: 180
    update_interval: 1s
    lambda: |-
      const int x = ${oled_x}, y = ${oled_y};
      // For 15 s after boot, frame the visible area: a missing or doubled
      // edge means oled_x / oled_y are off.
      if (millis() < 15000) it.rectangle(x, y, 72, 40);
      it.printf(x, y + 0, id(small), "%s", id(wifi_rssi).has_state() ? "WIFI" : "NO WIFI");
      if (id(wifi_rssi).has_state())
        it.printf(x + 71, y + 0, id(small), TextAlign::TOP_RIGHT, "%.0f", id(wifi_rssi).state);
      it.printf(x, y + 10, id(small), "HA %s", api_is_connected() ? "OK" : "--");
      it.printf(x, y + 20, id(small), "BLE %.0f/M",
                id(adverts_per_min).has_state() ? id(adverts_per_min).state : 0.0f);
      it.printf(x, y + 30, id(small), "UP %.0fM",
                id(uptime_s).has_state() ? id(uptime_s).state / 60 : 0.0f);

script:
  - id: display_on
    then:
      - lambda: id(oled).turn_on();
  - id: display_off
    then:
      - lambda: id(oled).turn_off();
