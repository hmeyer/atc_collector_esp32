# Waveshare ESP32-S3-LCD-1.47: 172x320 ST7789, used in landscape.

substitutions:
  name: atc-s3
  friendly_name: ATC S3
  button_pin: GPIO0

packages:
  common: !include common.yaml
  # Header pins 1-13 are free on this board; GPIO3 is a strapping pin.
  co2: !include {file: co2.yaml, vars: {sda: GPIO2, scl: GPIO1}}
  radio433: !include
    file: radio433.yaml
    vars: {cs: GPIO10, sck: GPIO12, mosi: GPIO11, miso: GPIO13, gdo0: GPIO9, gdo2: GPIO8}

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

spi:
  - id: lcd_spi
    clk_pin: GPIO40
    mosi_pin:
      number: GPIO45
      ignore_strapping_warning: true

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO48

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    entity_category: config

font:
  - file: "gfonts://Roboto Mono"
    id: medium
    size: 22
  - file: "gfonts://Roboto Mono@700"
    id: large
    size: 40

color:
  - id: grey
    hex: "8A8A8A"
  - id: cyan
    hex: "5AC8E6"
  - id: green
    hex: "4CC764"
  - id: orange
    hex: "F0A030"
  - id: red
    hex: "F05050"

display:
  - platform: mipi_spi
    id: lcd
    spi_id: lcd_spi
    model: ST7789V
    dc_pin: GPIO41
    cs_pin: GPIO42
    reset_pin: GPIO39
    invert_colors: true
    color_order: rgb
    dimensions:
      width: 172
      height: 320
      # The 172 px wide panel sits at column 34 of the controller's 240.
      offset_width: 34
      offset_height: 0
    # Landscape; 90 showed the image upside down on the board.
    rotation: 270
    update_interval: 1s
    lambda: |-
      it.fill(Color::BLACK);
      const bool wifi = id(wifi_rssi).has_state();
      const bool ha = api_is_connected();
      // CO2, colour-coded: < 1000 ppm good, < 1400 ppm ventilate soon.
      if (id(co2).has_state()) {
        const float ppm = id(co2).state;
        const Color c = ppm < 1000 ? id(green) : ppm < 1400 ? id(orange) : id(red);
        it.printf(10, 6, id(large), c, "%.0f", ppm);
        it.print(310, 26, id(medium), id(grey), TextAlign::TOP_RIGHT, "ppm CO2");
      } else {
        it.print(10, 6, id(large), id(grey), "CO2 --");
      }
      if (id(co2_temperature).has_state() && id(co2_humidity).has_state())
        it.printf(10, 60, id(medium), Color::WHITE, "%.1f°C  %.0f%%",
                  id(co2_temperature).state, id(co2_humidity).state);
      it.printf(10, 92, id(medium), ha ? id(green) : id(red), "HA %s", ha ? "OK" : "--");
      if (wifi)
        it.printf(110, 92, id(medium), id(cyan), "Wi-Fi %.0f", id(wifi_rssi).state);
      else
        it.print(110, 92, id(medium), id(red), "Wi-Fi --");
      it.printf(10, 120, id(medium), id(grey), "BLE %.0f/min",
                id(adverts_per_min).has_state() ? id(adverts_per_min).state : 0.0f);
      it.printf(10, 146, id(medium), id(grey), "up %.0f min",
                id(uptime_s).has_state() ? id(uptime_s).state / 60 : 0.0f);

script:
  - id: display_on
    then:
      - light.turn_on: backlight
  - id: display_off
    then:
      - light.turn_off: backlight
