name: Build & publish web flasher

on:
  # Branches are built through their pull request; building their pushes too
  # would run every commit twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ESPHOME_VERSION: "2026.9.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ESP-IDF, toolchains and downloaded fonts: only change with the ESPHome
      # version, so this is saved rarely.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-tools-${{ runner.os }}-${{ env.ESPHOME_VERSION }}
          restore-keys: esphome-tools-${{ runner.os }}-
      # Object files. Saved per commit, so only changed sources recompile.
      - uses: actions/cache@v6
        with:
          path: esphome/.esphome
          key: esphome-build-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ github.sha }}
          restore-keys: |
            esphome-build-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-
      # Host tests for lib/atc_parser.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            !~/.platformio/.cache
            .pio
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      # ESPHome pins its own platformio, which also runs the host tests.
      - run: pip install esphome==${{ env.ESPHOME_VERSION }}
      - name: Unit tests (host)
        run: pio test -e native
      - name: Build firmware
        run: |
          for board in atc-c3 atc-s3; do
            esphome -s version "${GITHUB_SHA::7}" compile "esphome/$board.yaml"
          done
      - name: Assemble flasher site
        run: >
          python scripts/build_site.py _site "${GITHUB_SHA::7}"
          atc-c3:ESP32-C3 atc-s3:ESP32-S3
      - name: Upload firmware images
        uses: actions/upload-artifact@v7
        with:
          name: atc_collector-${{ github.sha }}
          path: _site/*.bin
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails early with a clear message if Pages isn't enabled. One-time
      # setup (can't be done with GITHUB_TOKEN): Settings -> Pages ->
      # Source: "GitHub Actions". Needs a public repo on the free plan.
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
