name: Build & publish web flasher

on:
  # Branches are built through their pull request; building their pushes too
  # would run every commit twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ESPHOME_VERSION: "2026.9.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # uv provides Python and a venv on PATH for esphome and pio.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          cache-dependency-glob: .github/workflows/build.yml
      # ESP-IDF, toolchains and downloaded fonts: only change with the ESPHome
      # version, so this is saved rarely.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-tools-${{ runner.os }}-${{ env.ESPHOME_VERSION }}
          restore-keys: esphome-tools-${{ runner.os }}-
      # Object files. Saved per commit, so only changed sources recompile.
      - uses: actions/cache@v6
        with:
          path: esphome/.esphome
          key: esphome-build-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ github.sha }}
          restore-keys: |
            esphome-build-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-
      # Host tests for lib/atc_parser.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            !~/.platformio/.cache
            .pio
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      # ESPHome pins its own platformio, which also runs the host tests.
      - run: uv pip install esphome==${{ env.ESPHOME_VERSION }}
      - name: Unit tests (host)
        run: pio test -e native
      # Each board's firmware version is a hash of its resolved config and the
      # ESPHome version, not the commit: the version is compiled into a header
      # every ESPHome source includes, so a per-commit version recompiled all
      # of them on every board for every commit. It also means a board is only
      # offered an update when its own firmware changed.
      - name: Build firmware
        run: |
          for board in atc-c3 atc-s3 atc-tdisplay; do
            v=$( { echo "$ESPHOME_VERSION"; esphome -s version 0 config "esphome/$board.yaml" | grep -v '^INFO'; } | sha256sum | cut -c1-8 )
            echo "$board: version $v"
            echo "${board//-/_}=$v" >> "$GITHUB_ENV"
            esphome -s version "$v" compile "esphome/$board.yaml"
          done
      - name: Assemble flasher site
        run: >
          python scripts/build_site.py _site "${GITHUB_SHA::7}"
          atc-c3:ESP32-C3:$atc_c3:legacy atc-s3:ESP32-S3:$atc_s3:legacy
          atc-tdisplay:ESP32:$atc_tdisplay
      - name: Upload firmware images
        uses: actions/upload-artifact@v7
        with:
          name: atc_collector-${{ github.sha }}
          path: _site/*.bin
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails early with a clear message if Pages isn't enabled. One-time
      # setup (can't be done with GITHUB_TOKEN): Settings -> Pages ->
      # Source: "GitHub Actions". Needs a public repo on the free plan.
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
