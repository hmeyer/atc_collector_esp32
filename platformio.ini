; Supported boards:
;   esp32c3_oled    ESP32-C3 "OLED Entwicklungsboard" (0.42" 72x40 SSD1306)
;   esp32s3_lcd147  Waveshare ESP32-S3-LCD-1.47 (172x320 ST7789)
[platformio]
default_envs = esp32c3_oled, esp32s3_lcd147

[env]
test_framework = unity

[esp32]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
extra_scripts = post:scripts/merge_bin.py
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    ; USB-CDC on the chip's native USB, so Serial works without a UART adapter.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

[env:esp32c3_oled]
extends = esp32
board = esp32-c3-devkitm-1
lib_deps =
    ${esp32.lib_deps}
    olikraus/U8g2@^2.35.30
build_src_filter = +<*> -<display_*.cpp> +<display_oled.cpp>
build_flags =
    ${esp32.build_flags}
    -DBUTTON_PIN=9
    ; OLED wiring of the common 0.42" board. Override if yours differs.
    -DOLED_SDA=5
    -DOLED_SCL=6
    ; 1 = 72x40 (0.42"), 0 = 128x64 (0.96")
    -DOLED_72X40=1

[env:esp32s3_lcd147]
extends = esp32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
lib_deps =
    ${esp32.lib_deps}
    moononournation/GFX Library for Arduino@1.4.9
build_src_filter = +<*> -<display_*.cpp> +<display_st7789.cpp>
build_flags =
    ${esp32.build_flags}
    -DBUTTON_PIN=0
    ; LCD wiring of the Waveshare board.
    -DLCD_MOSI=45
    -DLCD_SCLK=40
    -DLCD_CS=42
    -DLCD_DC=41
    -DLCD_RST=39
    -DLCD_BL=48

; Host-side unit tests for the advertisement parser: `pio test -e native`
[env:native]
platform = native
build_flags = -std=c++17
test_build_src = no
