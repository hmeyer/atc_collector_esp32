; ESP32-C3 "OLED Entwicklungsboard" (ESP32-C3 SuperMini with 0.42" 72x40 SSD1306).
[platformio]
default_envs = esp32c3_oled

[env]
test_framework = unity

[env:esp32c3_oled]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
extra_scripts = post:scripts/merge_bin.py
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    olikraus/U8g2@^2.35.30
build_flags =
    ; USB-CDC on the C3's native USB, so Serial works without a UART adapter.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; OLED wiring of the common 0.42" board. Override if yours differs.
    -DOLED_SDA=5
    -DOLED_SCL=6
    ; 1 = 72x40 (0.42"), 0 = 128x64 (0.96")
    -DOLED_72X40=1
test_ignore = *

; Host-side unit tests for the advertisement parser: `pio test -e native`
[env:native]
platform = native
build_flags = -std=c++17
test_build_src = no
